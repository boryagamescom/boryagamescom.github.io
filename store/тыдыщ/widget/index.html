            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }

        .stat-item .label {
            color: #555; 
            text-transform: uppercase;
            font-size: 11px;
            margin-right: 4px;
        }

        .stat-item .value {
            font-weight: bold;
            color: #bbb; 
        }
        .separator {
            width: 1px;
            height: 12px;
            background-color: #222; 
        }

            background-color: #8a2be2;

            padding: 5px 20px;
            text-decoration: none;
            border-radius: 12px;
