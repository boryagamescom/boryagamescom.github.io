<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виджет Тыдыщ!</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Обнуляем отступы, чтобы виджет прижимался к краям iframe */
        html, body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Позволяет виджету принимать фон сайта-родителя */
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Отключаем появление полос прокрутки */
            color: #ffffff;
        }

        .widget-container {
            display: flex;
            align-items: center;
            border: 1px solid #222; /* Цвет рамки из вашего .stats-grid */
            border-radius: 25px; /* Скругление из вашего .app-main img */
            padding: 12px 20px;
            background-color: #000000; /* Фон в тон вашего body */
            box-sizing: border-box;
            max-width: 100%;
            height: 110px; /* Фиксированная высота виджета для встраивания */
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            margin-right: 18px;
            flex-shrink: 0;
            object-fit: cover;
        }

        .info {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-line {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            color: #8a2be2; /* Ваш фирменный цвет заголовков */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Блок характеристик в строку с вертикальными разделителями */
        .widget-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .stat-item {
            font-size: 12px;
            color: #888; /* Короткое описание (.short-description) */
            white-space: nowrap;
        }

        .stat-item .label {
            color: #555; /* Цвет лейблов из .stat-box */
            text-transform: uppercase;
            font-size: 11px;
            margin-right: 4px;
        }

        .stat-item .value {
            font-weight: bold;
            color: #bbb; /* Цвет основного текста .description-text */
        }

        /* Вертикальный разделитель */
        .separator {
            width: 1px;
            height: 12px;
            background-color: #222; /* Цвет линий из вашего кода */
        }

        .btn-download {
            align-self: flex-start;
            background-color: #8a2be2;
            color: white;
            padding: 5px 20px;
            text-decoration: none;
            border-radius: 12px; /* Скругление вашей кнопки */
            font-weight: bold;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-download:hover {
            background-color: #a347ff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="widget-container">
    <!-- Иконка и путь из вашего кода -->
    <img class="icon" src="http://boryagames.ru" alt="App Icon">
    
    <div class="info">
        <div class="header-line">
            <h3 class="title">Тыдыщ!</h3>
        </div>
        
        <!-- Секция характеристик с вертикальным разделителем -->
        <div class="widget-stats">
            <div class="stat-item">
                <span class="label">Разработчик:</span>
                <span class="value">Borya Games</span>
            </div>
            <div class="separator"></div>
            <div class="stat-item">
                <span class="label">Возраст:</span>
                <span class="value">16+</span>
            </div>
        </div>

        <!-- Ссылка на скачивание -->
        <a class="btn-download" href="https://boryagames.ru" target="_blank">Скачать</a>
    </div>
</div>

</body>
</html>
